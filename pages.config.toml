# Cloudflare Pages 配置
# 参考: https://developers.cloudflare.com/pages/platform/configuration/

[build]
command = "npm run build"
output_directory = ".vercel/output/static"

[build.environment]
# Node.js 版本
NODE_VERSION = "20"

# 生产环境标志
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"

# 注意：实际的环境变量需要在 Cloudflare Dashboard 中设置
# JWT_SECRET, TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY, NEXT_PUBLIC_APP_URL
